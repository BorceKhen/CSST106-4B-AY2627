<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSST 106 — Computer Vision Laboratory Suite</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
  <style>
    :root {
      --bg: #0b1120;
      --panel: #162033;
      --border: #29354d;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 18px 40px;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    .wrap { max-width: 1280px; margin: 0 auto; }
    .hero {
      background: linear-gradient(135deg, #172554, #1e293b 55%, #0f172a);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 20px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .hero-left { display: flex; gap: 16px; align-items: center; }
    .hero-logo {
      width: 56px; height: 56px; border-radius: 14px;
      display: grid; place-items: center;
      border: 1.5px solid #38bdf8;
      background: rgba(2,132,199,0.22);
      color: #38bdf8;
    }
    .badge {
      background: #f8fafc; color: #0f172a;
      font-size: 11px; font-weight: 700;
      padding: 4px 10px; border-radius: 6px; display: inline-block;
    }
    .tag {
      background: #0f172a; color: var(--muted);
      border: 1px solid #334155; font-size: 11px;
      padding: 3px 8px; border-radius: 5px; display: inline-block;
    }
    h1 { margin: 6px 0 8px; font-size: 22px; color: #f8fafc; }
    .meta { display: flex; gap: 26px; flex-wrap: wrap; }
    .meta small { display: block; color: var(--muted); font-size: 11px; font-weight: 600; }
    .meta strong { font-size: 13.5px; color: #f1f5f9; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 7px 13px; border-radius: 7px; font-size: 12.5px; font-weight: 600;
      text-decoration: none; background: #223047; color: var(--text);
      border: 1px solid #354764; cursor: pointer;
    }
    .btn:hover { background: #2d3f5e; border-color: #64748b; }
    .btn-primary { background: #0284c7; color: #fff; border-color: #38bdf8; }
    .btn-primary:hover { background: #0369a1; }
    .toolbar {
      background: #131c31; border: 1px solid #25334d; border-radius: 10px;
      padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 10px;
      justify-content: space-between; align-items: center; margin-bottom: 14px;
    }
    .toolbar label { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; }
    .chip {
      background: transparent; border: 1px solid transparent; color: var(--muted);
      padding: 6px 12px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .chip:hover { background: #1e293b; color: #f8fafc; }
    .chip.active { background: #0284c7; color: #fff; border-color: #38bdf8; }
    input[type="search"] {
      background: #0b1120; color: #f8fafc; border: 1px solid #334155;
      border-radius: 7px; padding: 7px 11px; font-size: 12px; width: 280px;
    }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 14px;
    }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-left: 4px solid var(--accent, #38bdf8); border-radius: 12px;
      padding: 15px; display: flex; flex-direction: column; gap: 10px;
    }
    .card:hover { background: #1a263c; border-color: var(--accent, #38bdf8); }
    .card-head { display: flex; gap: 12px; align-items: flex-start; }
    .lab-icon {
      width: 40px; height: 40px; flex-shrink: 0; border-radius: 9px;
      border: 1.4px solid; display: grid; place-items: center; padding: 7px;
    }
    .card-top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
    .lab-pill {
      background: var(--accent, #38bdf8); color: #0f172a;
      font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 5px;
    }
    .card h2 { margin: 0; font-size: 14.5px; color: #f8fafc; }
    .card p { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.45; flex: 1; }
    .card-actions { display: flex; gap: 8px; }
    .btn-lab {
      flex: 2; background: var(--accent, #38bdf8); color: #0f172a;
      border-color: var(--accent, #38bdf8); font-weight: 700;
    }
    .btn-lab:hover { filter: brightness(0.92); background: var(--accent, #38bdf8); }

    /* Workspace view */
    .ws-top {
      background: #131c31; border: 1px solid #25334d; border-radius: 11px;
      padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 10px;
      align-items: center; justify-content: space-between; margin-bottom: 12px;
    }
    .ws-title-grp { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .ws-title-grp h2 { margin: 0; font-size: 17px; color: #f8fafc; }
    .tab-bar {
      background: #131c31; border: 1px solid #25334d; border-radius: 9px;
      padding: 6px 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px;
    }
    .tab {
      background: transparent; border: 1px solid transparent; color: var(--muted);
      padding: 6px 13px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .tab.active { background: #0284c7; color: #fff; border-color: #38bdf8; }
    .ws-grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
    .ws-grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    .ws-grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    .panel {
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px; display: flex; flex-direction: column; gap: 8px;
    }
    .panel-hdr {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; font-weight: 700; color: #38bdf8; letter-spacing: 0.4px;
    }
    .cv-canvas { width: 100%; max-height: 430px; object-fit: contain; background: #0b1120; border-radius: 6px; }
    .clickable { cursor: crosshair; }
    .ctrl-stack { display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; }
    .ctrl-stack label { display: flex; flex-direction: column; gap: 4px; }
    .mono-box {
      background: #0b1120; border: 1px solid #29354d; border-radius: 7px;
      padding: 10px; font-family: Consolas, monospace; font-size: 12px;
      color: #f1f5f9; white-space: pre-wrap; margin: 0;
    }
    .qa-box { margin-top: 10px; font-size: 13px; line-height: 1.5; color: #cbd5e1; }
    .qa-box h3 { margin: 0 0 6px; color: #38bdf8; font-size: 14px; }
    .face-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .face-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .face-item canvas { width: 100%; image-rendering: pixelated; border-radius: 4px; }
    .face-item small { font-size: 10.5px; font-family: Consolas, monospace; text-align: center; }
    code { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="home-view">
      <section class="hero">
        <div class="hero-left">
          <div class="hero-logo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <ellipse cx="12" cy="12" rx="9" ry="6"/><circle cx="12" cy="12" r="3" fill="currentColor"/>
            </svg>
          </div>
          <div>
            <span class="badge">CSST 106</span>
            <span class="tag">Perception and Computer Vision • 1st Semester, AY 2026–2027</span>
            <h1>Computer Vision Laboratory Suite</h1>
            <div class="meta">
              <div><small>Student</small><strong>Ron Ken S. Borce</strong></div>
              <div><small>Section</small><strong>BSCS 4B</strong></div>
            </div>
          </div>
        </div>
        <div style="display:flex;gap:8px;flex-direction:column;align-items:flex-end">
          <a class="btn btn-primary" href="https://github.com/BorceKhen/CSST106-4B-AY2627" target="_blank" rel="noopener">View Repository</a>
          <span class="tag">7 / 7 Interactive Labs Ready</span>
        </div>
      </section>

      <section class="toolbar">
        <div class="chips" id="chips">
          <button class="chip active" data-cat="All">All</button>
          <button class="chip" data-cat="Image Processing">Image Processing</button>
          <button class="chip" data-cat="Features & ML">Features &amp; ML</button>
          <button class="chip" data-cat="Deep Learning">Deep Learning</button>
        </div>
        <input type="search" id="search" placeholder="Filter labs (Canny, YOLO, PCA, Segmentation)..." />
      </section>

      <section class="grid" id="grid"></section>
    </div>

    <div id="workspace-view" style="display:none">
      <div class="ws-top">
        <div class="ws-title-grp">
          <button class="btn" id="back-btn">← Back to Suite</button>
          <span class="lab-pill" id="ws-pill">Lab</span>
          <h2 id="ws-title">Laboratory</h2>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <a class="btn" id="ws-report" href="#">Report (.docx)</a>
          <a class="btn" id="ws-code" href="#" target="_blank" rel="noopener">Python UI Source</a>
        </div>
      </div>
      <div id="ws-body"></div>
    </div>
  </div>
  <script src="./web_assets/app.js"></script>
</body>
</html>
